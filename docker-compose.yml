version: "3.9"

services:

  app:

    build: .

    container_name: ai_pdf_app

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres

    restart: always

  postgres:

    image: postgres:16

    container_name: postgres_db

    environment:

      POSTGRES_DB: pdf_db

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    restart: always

  redis:
    image: redis:7-alpine

    container_name: redis_cache

    ports:
      - "6379:6379"

    restart: always

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

volumes:

  postgres_data:
  redis_data: